name: Build and verify

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cheesetv-front
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cheesetv-front/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-test-password
          MYSQL_DATABASE: cheesetv_ci_it
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=12
    env:
      ONLINE_REWARD_IT: 'true'
      BUSINESS_JDBC_URL: jdbc:mysql://127.0.0.1:3306/cheesetv_ci_it?serverTimezone=UTC
      BUSINESS_DB_USER: root
      BUSINESS_DB_PASSWORD: ci-only-test-password
      BUSINESS_REDIS_HOST: 127.0.0.1
      BUSINESS_REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Generate ephemeral test signing key
        run: echo "JWT_SECRET_BASE64=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Match the isolated database collation to production
        env:
          MYSQL_PWD: ci-only-test-password
        run: >-
          docker exec -e MYSQL_PWD "${{ job.services.mysql.id }}"
          mysql -uroot -e
          'ALTER DATABASE cheesetv_ci_it CHARACTER SET utf8mb4 COLLATE utf8mb4_bin;'
      - name: Verify video backend against isolated services
        run: mvn -B -ntp verify
